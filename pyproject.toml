[project]
name = "data-conduit"
version = "0.1.0"
description = "A Python toolkit for modular data processing workflows for experimental neuroscience labs"
readme = "README.md"
authors = [{name = "Keshavarzi Lab"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "data pipelines",
  "experimental neuroscience",
  "multimodal data",
  "time-series analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11.0"
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "pyyaml",
]

# Optional feature groups. The core install stays light (CSV/array work only);
# install an extra to pull in what a given modality needs, e.g.
#   pip install data-conduit[harp,pose,notebooks]
[project.optional-dependencies]
# HARP register decoding for the Nosepoke / SoundCard / Camera presets.
harp = ["harp-python"]
# DeepLabCut pose: reading the .h5 outputs needs PyTables.
pose = ["tables"]
# Interop with the neuroinformatics movement pose-analysis package.
movement = ["movement"]
# Running the workflow notebooks (interactive tables + a kernel + plots).
notebooks = ["itables", "jupyterlab", "ipykernel", "matplotlib"]
# Everything above, for a full analysis environment.
all = ["harp-python", "tables", "movement", "itables", "jupyterlab", "ipykernel", "matplotlib"]

[project.urls]
Homepage = "https://keshavarzi-lab.github.io/data-conduit/"
Documentation = "https://keshavarzi-lab.github.io/data-conduit/"
Repository = "https://github.com/Keshavarzi-lab/data-conduit"
Issues = "https://github.com/Keshavarzi-lab/data-conduit/issues"
Changelog = "https://github.com/Keshavarzi-lab/data-conduit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
  "/src/data_conduit/data_conduit_demos",
  "/src/data_conduit/test_celia",
  "/src/data_conduit/tests",
  "/src/data_conduit/qc/*.ipynb",
  "/src/data_conduit/qc/*.bmp",
  "/src/data_conduit/qc/*.gif",
  "/src/data_conduit/qc/*.jpeg",
  "/src/data_conduit/qc/*.jpg",
  "/src/data_conduit/qc/*.md",
  "/src/data_conduit/qc/*.png",
  "/src/data_conduit/qc/*.svg",
  "/src/data_conduit/qc/*.tif",
  "/src/data_conduit/qc/*.tiff",
  "/src/data_conduit/qc/*.webp",
  "/src/data_conduit/qc/*.csv",
  "/src/data_conduit/qc/*.ods",
  "/src/data_conduit/qc/*.tsv",
  "/src/data_conduit/qc/*.xls",
  "/src/data_conduit/qc/*.xlsx",
]

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "ruff>=0.15.2",
]
docs = [
  "linkify-it-py",
  "myst-parser",
  "nbsphinx",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-sitemap",
]

[tool.ruff]
line-length = 180
exclude = ["__init__.py", "build", ".eggs"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "B", "SIM", "TC", "C90", "D", "NPY201"]
ignore = ["D203", 
        "D213",
        "D300",
        "C901",
        "D417", "D202", "D205", "D212", "D406", "D407", "D410","D411", "D413"]
per-file-ignores = {"tests/*" = ["D100", "D103", "D205"]}

[tool.ruff.format]
docstring-code-format = true
